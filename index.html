<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="A little hello from this corner of the internet.">
  <title>Hello, world!</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26372f;
      --muted: #64736a;
      --paper: #fbfaf6;
      --green: #315c46;
      --line: #e5e6dc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 14% 18%, #e4eddf 0, transparent 36%),
        radial-gradient(ellipse at 88% 82%, #f1e7d6 0, transparent 34%),
        #f5f1e8;
      font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    .card {
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgb(255 255 255 / 75%);
      border-radius: 28px;
      background: rgb(251 250 246 / 92%);
      box-shadow: 0 24px 70px rgb(48 57 43 / 10%), 0 2px 8px rgb(48 57 43 / 4%);
      text-align: center;
    }

    .mark {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 28px;
      border-radius: 21px;
      color: var(--green);
      background: #e9f0e5;
      font-size: 30px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 4.2rem);
      letter-spacing: -0.055em;
      line-height: 1.05;
    }

    .message {
      max-width: 390px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.7;
    }

    .divider {
      width: 48px;
      height: 1px;
      margin: 30px auto 22px;
      background: var(--line);
    }

    .note {
      margin: 0;
      color: #7b857d;
      font-size: 0.88rem;
    }

    @media (prefers-reduced-motion: no-preference) {
      .card { animation: arrive 650ms cubic-bezier(.2,.75,.25,1) both; }
      @keyframes arrive {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">☀️</div>
    <p class="eyebrow">A fresh little start</p>
    <h1>Hello, I am Asad</h1>
    <p class="message">It’s lovely to have you here. Take a breath, get comfortable, and enjoy this little corner of the internet.</p>
    <div class="divider" aria-hidden="true"></div>
    <p class="note">Made with a little warmth and a lot of curiosity.</p>
  </main>
</body>
</html>
