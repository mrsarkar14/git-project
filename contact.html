<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="Get in touch with Asad.">
  <title>Contact | Hello, I am Asad</title>
  <style>
    :root { color-scheme: light; --ink: #26372f; --muted: #64736a; --green: #315c46; --line: #e5e6dc; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; color: var(--ink);
      background: radial-gradient(ellipse at 14% 18%, #e4eddf 0, transparent 36%), radial-gradient(ellipse at 88% 82%, #f1e7d6 0, transparent 34%), #f5f1e8;
      font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .card { width: min(100%, 620px); padding: clamp(30px, 7vw, 60px); border: 1px solid rgb(255 255 255 / 75%); border-radius: 28px; background: rgb(251 250 246 / 94%); box-shadow: 0 24px 70px rgb(48 57 43 / 10%); }
    .eyebrow { margin: 0 0 12px; color: var(--green); font-size: .76rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 4rem); letter-spacing: -.055em; line-height: 1.05; }
    .intro { margin: 20px 0 0; color: var(--muted); font-size: 1.12rem; line-height: 1.75; }
    .contact-link { display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; padding: 14px 19px; border-radius: 14px; color: #fff; background: var(--green); font-weight: 650; text-decoration: none; transition: background 160ms ease, transform 160ms ease; }
    .contact-link:hover { background: #244936; transform: translateY(-1px); }
    .contact-link:focus-visible { outline: 3px solid #9bbda4; outline-offset: 4px; }
    .hint { margin: 13px 0 0; color: #7b857d; font-size: .88rem; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
    nav a { padding: 10px 15px; border: 1px solid var(--line); border-radius: 999px; color: var(--green); font-size: .9rem; font-weight: 650; text-decoration: none; }
    nav a:hover, nav a:focus-visible { background: #e9f0e5; border-color: #c9d8ca; }
    nav a:focus-visible { outline: 3px solid #9bbda4; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Say hello</p>
    <h1>Let’s talk</h1>
    <p class="intro">Have a question, an idea, or just want to say hi? I’d be happy to hear from you.</p>
    <a class="contact-link" href="mailto:hello@example.com">✉ <span>Email me</span></a>
    <p class="hint">Replace hello@example.com with your email address to make this link yours.</p>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </main>
</body>
</html>
